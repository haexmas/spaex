[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "haex-hive"
version = "4.0.0.dev0"
description = "v4 vocabulary CLI (spaex 4.0-in-development, PyPI name and package rename land in a later phase of Spec 014): add/remove, migrate, constitution assemble/show."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "haex-hive contributors" }]
dependencies = [
    "jsonschema>=4.18",
]

[project.scripts]
haex = "haex_hive.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-subprocess>=1.5",
    "ruff>=0.5",
    "mypy>=1.8",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
haex_hive = ["schema/data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["haex_hive"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: opt-in benchmarks and heavy end-to-end scenarios",
]
addopts = "-m 'not slow'"
