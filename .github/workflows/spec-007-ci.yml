name: spec-007-ci

on:
  push:
    branches: [main, "007-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run default pytest selection
        run: pytest -q
      - name: Run slow pytest selection
        run: >-
          python -c "import pytest, sys; code = pytest.main(['-q', '-o', 'addopts=', '-m', 'slow']);
          sys.exit(0 if code == pytest.ExitCode.NO_TESTS_COLLECTED else code)"
      - name: Run ruff
        run: ruff check .
      - name: Run mypy
        run: mypy src
