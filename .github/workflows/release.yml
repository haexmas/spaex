name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to publish (must match pyproject.toml). Only needed to
          catch up a tag whose push-triggered publish never ran, since
          workflow_dispatch checks the workflow file at the dispatched ref
          and an existing tag predates this trigger.
        required: false
  workflow_call:
    inputs:
      version:
        description: >-
          Version to publish (must match pyproject.toml). Passed by
          release-please.yml, since a GITHUB_TOKEN tag push doesn't trigger
          this workflow's own push trigger.
        required: true
        type: string

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      stable: ${{ steps.release-version.outputs.stable }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
      - name: install build tooling
        run: python -m pip install --upgrade pip build
      - name: verify release version
        id: release-version
        env:
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          package_version="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as handle:
              print(tomllib.load(handle)["project"]["version"])
          PY
          )"
          if [ -n "$DISPATCH_VERSION" ]; then
            tag_version="$DISPATCH_VERSION"
          else
            tag_version="${REF_NAME#v}"
          fi
          if [ "$package_version" != "$tag_version" ]; then
            echo "package version $package_version does not match tag version $tag_version" >&2
            exit 1
          fi
          if [[ "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi
      - name: build sdist and wheel
        run: python -m build
      - name: upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: needs.build.outputs.stable == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/spaex
    permissions:
      id-token: write
    steps:
      - name: download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: publish to PyPI via Trusted Publishing (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
